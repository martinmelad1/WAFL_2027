# WAFL 2027 - pallet / dock location database   (PROPOSED SCHEMA - perception owner to confirm)
# GENERATED by wafl_simulation/scripts/generate_assets.py from the simulated warehouse layout.
#
# Two frames are given for every pose:
#   world : Gazebo world frame (what the .world file uses)
#   map   : SLAM map frame. SLAM Toolbox starts the map at the robot's start pose, so
#           map = world expressed relative to the spawn pose -5.5 0 0 (x, y, yaw).
#           >>> Nav2 goals and mission_manager must use the `map` poses. <<<
# Poses are (x [m], y [m], yaw [rad]).
#   pallet_pose   : pallet CENTRE; yaw = direction the forks travel to enter it
#   approach_pose : base_footprint pose to reach in the APPROACH state, facing the pallet
#                   (ASSUMPTION: 2.1 m from the pallet entry face = fork tip 1.6 m + 0.5 m stand-off;
#                    recompute with the real robot geometry)
# Empty bays (marker_id: null) are drop-off spots.

aruco:
  dictionary: DICT_4X4_100
  marker_size_m: 0.15     # side of the black square (quiet zone excluded)

spawn:                     # robot start pose in the simulated world
  world: [-5.5, 0, 0]

locations:
  - name: Location_A1
    label: A1
    marker_id: 0
    pallet_present_at_start: true
    pallet_pose:   {world: [-1.8, 2.25, 1.5708], map: [3.7, 2.25, 1.5708]}
    approach_pose: {world: [-1.8, -0.25, 1.5708], map: [3.7, -0.25, 1.5708]}
  - name: Location_A2
    label: A2
    marker_id: 1
    pallet_present_at_start: true
    pallet_pose:   {world: [0, 2.25, 1.5708], map: [5.5, 2.25, 1.5708]}
    approach_pose: {world: [0, -0.25, 1.5708], map: [5.5, -0.25, 1.5708]}
  - name: Location_A3
    label: A3
    marker_id: null
    pallet_present_at_start: false
    pallet_pose:   {world: [1.8, 2.25, 1.5708], map: [7.3, 2.25, 1.5708]}
    approach_pose: {world: [1.8, -0.25, 1.5708], map: [7.3, -0.25, 1.5708]}
  - name: Location_B1
    label: B1
    marker_id: 2
    pallet_present_at_start: true
    pallet_pose:   {world: [-1.8, -2.25, -1.5708], map: [3.7, -2.25, -1.5708]}
    approach_pose: {world: [-1.8, 0.25, -1.5708], map: [3.7, 0.25, -1.5708]}
  - name: Location_B2
    label: B2
    marker_id: 3
    pallet_present_at_start: true
    pallet_pose:   {world: [0, -2.25, -1.5708], map: [5.5, -2.25, -1.5708]}
    approach_pose: {world: [0, 0.25, -1.5708], map: [5.5, 0.25, -1.5708]}
  - name: Location_B3
    label: B3
    marker_id: null
    pallet_present_at_start: false
    pallet_pose:   {world: [1.8, -2.25, -1.5708], map: [7.3, -2.25, -1.5708]}
    approach_pose: {world: [1.8, 0.25, -1.5708], map: [7.3, 0.25, -1.5708]}

charging_dock:
  name: Charging_Dock
  marker_id: 99
  marker_pose:   {world: [6.475, 0, 0], map: [11.975, 0, 0]}    # marker plane, faces -x
  approach_pose: {world: [3.975, 0, 0], map: [9.475, 0, 0]}    # base_footprint, heading +x (ASSUMPTION: 2.5 m from marker)
