# ros_gz_bridge.yaml - Gazebo Harmonic <-> ROS 2 Jazzy topic bridge for WAFL 2027.
# Used by launch/gazebo.launch.py:  parameter_bridge --ros-args -p config_file:=<this file>
#
# Contract (README sec. 6). Names that MUST stay in sync with the world / robot plugins:
#   world name  = "warehouse"   (/world/warehouse/...)
#   model name  = "wafl"        (/model/wafl/...)
#
# Deliberately NOT bridged:
#   /model/wafl/tf*   OdometryPublisher TF - the EKF is the ONLY odom->base_footprint publisher.
#   /cmd_vel          Gazebo never reads raw /cmd_vel; it only reads the per-joint commands that
#                     base_controller publishes after arbitration.

# ---------------- clock (without this every use_sim_time node stalls) ----------------
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ---------------- sensors ----------------
- ros_topic_name: "/scan"
  gz_topic_name: "/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth/image_raw"
  gz_topic_name: "/camera/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ---------------- odometry / joint state ----------------
- ros_topic_name: "/odom"
  gz_topic_name: "/model/wafl/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/warehouse/model/wafl/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ---------------- actuation (all written by base_controller, except the fork) ----------------
- ros_topic_name: "/front_steer_cmd_pos"
  gz_topic_name: "/model/wafl/front_steer/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/castor_cmd_pos"
  gz_topic_name: "/model/wafl/joint/caster_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/front_left_wheel_cmd_vel"
  gz_topic_name: "/model/wafl/joint/front_left_wheel_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/front_right_wheel_cmd_vel"
  gz_topic_name: "/model/wafl/joint/front_right_wheel_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/fork_cmd_vel"
  gz_topic_name: "/model/wafl/joint/fork_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ