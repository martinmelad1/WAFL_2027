# ros_gz_bridge.yaml - Gazebo Harmonic <-> ROS 2 Jazzy topic bridge for WAFL 2027.
# Used by launch/gazebo.launch.py:  parameter_bridge --ros-args -p config_file:=<this file>
# Every variable is explained in docs/README_ros_gz_bridge.md.
#
# Contract (README sec. 6). Names that MUST stay in sync with the world / robot plugins:
#   world name  = "warehouse"   (/world/warehouse/...)
#   model name  = "wafl"        (/model/wafl/...)
# The gz-side topics below are produced/consumed by wafl_simulation/urdf/wafl_gz_plugins.xacro
# (generated by scripts/generate_assets.py) and worlds/warehouse.world.
#
# Sections: 1 clock | 2 sensors | 3 odometry + feedback | 4 joint actuation (commands IN)
#
# Deliberately NOT bridged:
#   /model/wafl/tf*   OdometryPublisher TF (it is aimed at /model/wafl/tf_unused_ekf_owns_odom_tf).
#                     The EKF is the ONLY odom->base_footprint publisher.
#   /cmd_vel          Gazebo must never read raw /cmd_vel. It only receives the per-joint commands that
#                     base_controller publishes AFTER arbitration (e-stop, mode, priority).
#   /cmd_vel_out      REMOVED - it belonged to the old DiffDrive plugin, which no longer exists.

# ======================= 1. clock (without this every use_sim_time node stalls) =======================
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ======================= 2. sensors =======================
- ros_topic_name: "/scan"                      # RPLiDAR A2M8-like, frame laser_link
  gz_topic_name: "/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image_raw"          # Kinect v1 RGB, 640x480 rgb8, frame camera_link
  gz_topic_name: "/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/depth/image_raw"    # registered depth, 32FC1 in METRES (see README of this package)
  gz_topic_name: "/camera/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"                       # raw sim IMU; hardware publishes /imu/data instead
  gz_topic_name: "/imu"                        # -> odom_covariance_fix -> /imu_fixed -> EKF
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ======================= 3. odometry + joint feedback (data OUT) =======================
- ros_topic_name: "/odom"                      # OdometryPublisher: frame_id odom, child_frame_id base_footprint,
  gz_topic_name: "/model/wafl/odometry"        # ground truth, ZERO covariance
  ros_type_name: "nav_msgs/msg/Odometry"       # -> odom_covariance_fix -> /odom_fixed -> EKF
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"              # feeds robot_state_publisher (steering/wheel/fork frames) + sim_fork_adapter
  gz_topic_name: "/world/warehouse/model/wafl/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ======================= 4. joint actuation (commands IN, published only by base_controller / sim_fork_adapter) =======================
- ros_topic_name: "/front_steer_cmd_pos"       # alpha, radians. ONE gz topic drives BOTH front steering joints
  gz_topic_name: "/model/wafl/front_steer/cmd_pos"   # (front_left_steer_joint + front_right_steer_joint stay parallel)
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/castor_cmd_pos"            # beta, radians, REAR wheel steering. "castor" spelling kept (README sec. 4.3/7)
  gz_topic_name: "/model/wafl/joint/caster_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/front_left_wheel_cmd_vel"  # front-left drive wheel, rad/s (= speed / wheel_radius)
  gz_topic_name: "/model/wafl/joint/front_left_wheel_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/front_right_wheel_cmd_vel" # front-right drive wheel, rad/s
  gz_topic_name: "/model/wafl/joint/front_right_wheel_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/fork_cmd_vel"              # written by sim_fork_adapter; m/s, + = up
  gz_topic_name: "/model/wafl/joint/fork_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
